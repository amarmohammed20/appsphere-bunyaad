# Bunyaad running its own reusable workflow, and a working copy of what every
# consuming repo writes. See docs/reusable-workflows.md.
name: DB Checks

on:
  pull_request:
    # ready_for_review matters: the job below skips drafts, and without this
    # event, marking a draft ready never re-runs it — so a required check
    # would sit unsatisfied forever.
    types: [opened, synchronize, reopened, ready_for_review]
    # Every branch. `branches: [main]` would silently run no checks at all on
    # pull requests targeting a develop or release branch.

# A new push makes the previous run's answer irrelevant.
concurrency:
  group: db-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The real ceiling on what the called workflow can do. A called workflow can
# only reduce the caller's grant, never raise it.
permissions:
  contents: read

jobs:
  # Job id must stay `db-checks`: branch protection matches "db-checks / Verify".
  db-checks:
    # Drafts are still being written; running the full suite on every push is noise.
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/db-checks-reusable.yml
    # Named secrets, never `secrets: inherit` — see docs/reusable-workflows.md.
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
