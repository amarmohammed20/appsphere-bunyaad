name: Notify Slack

on:
  workflow_call:
    inputs:
      title:
        description: Short headline for the message
        required: true
        type: string
      status:
        description: success | failure | info | warning
        required: true
        type: string
      description:
        description: Freeform text (what happened / what to do next)
        required: false
        type: string
      color:
        description: Hex color (e.g. #2eb886). Defaults by status if omitted.
        required: false
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Inputs are bound to env: rather than interpolated into the script.
      # `${{ }}` substitution happens before the shell runs, so a value
      # containing shell syntax would become part of the command itself and
      # could run arbitrary code on the runner — with the Slack webhook and
      # any other secrets in scope. Reading them as "$VAR" keeps them data.
      # The step below already does this; this one had been missed.
      - name: Compute color
        id: paint
        env:
          STATUS: ${{ inputs.status }}
          COLOR: ${{ inputs.color }}
        run: |
          case "$STATUS" in
            success) DEFAULT_COLOR="#2eb886" ;;  # green
            failure) DEFAULT_COLOR="#e01e5a" ;;  # red
            warning) DEFAULT_COLOR="#ecb22e" ;;  # yellow
            *)       DEFAULT_COLOR="#439fe0" ;;  # blue
          esac
          echo "color=${COLOR:-$DEFAULT_COLOR}" >> "$GITHUB_OUTPUT"

      - name: Post to Slack (Incoming Webhook)
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          TITLE: ${{ inputs.title }}
          STATUS: ${{ inputs.status }}
          DESC: ${{ inputs.description }}
          COLOR: ${{ steps.paint.outputs.color }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          payload=$(jq -n --arg title "$TITLE" \
                         --arg status "$STATUS" \
                         --arg desc "${DESC:-}" \
                         --arg color "$COLOR" \
                         --arg repo "$REPO" \
                         --arg branch "$BRANCH" \
                         --arg sha "$SHA" \
                         --arg actor "$ACTOR" \
                         --arg run_url "$RUN_URL" \
                         --arg commit_url "$COMMIT_URL" \
                         --arg workflow "$WORKFLOW" '
            {
              attachments: [
                {
                  color: $color,
                  blocks: [
                    {
                      type: "header",
                      text: { type: "plain_text", text: $title, emoji: true }
                    },
                    {
                      type: "section",
                      fields: [
                        { type: "mrkdwn", text: "*Status:*\n" + $status },
                        { type: "mrkdwn", text: "*Workflow:*\n" + $workflow },
                        { type: "mrkdwn", text: "*Repo:*\n" + $repo },
                        { type: "mrkdwn", text: "*Branch:*\n" + $branch },
                        { type: "mrkdwn", text: "*Actor:*\n" + $actor },
                        { type: "mrkdwn", text: "*Commit:*\n<" + $commit_url + "|" + ($sha[0:7]) + ">" }
                      ]
                    },
                    ( $desc | length ) as $hasdesc
                    | if $hasdesc > 0 then
                        { type: "section", text: { type: "mrkdwn", text: $desc } }
                      else
                        empty
                      end,
                    {
                      type: "actions",
                      elements: [
                        { type: "button", text: { type: "plain_text", text: "View run" }, url: $run_url },
                        { type: "button", text: { type: "plain_text", text: "View commit" }, url: $commit_url }
                      ]
                    }
                  ]
                }
              ]
            }')

          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$payload" "$WEBHOOK"
