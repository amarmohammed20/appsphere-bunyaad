# Builds an image, smoke-tests it, then pushes. Generic: it knows nothing about
# what is inside. The test runs against the locally-loaded image before any push.
name: Release image (reusable)

on:
  workflow_call:
    inputs:
      context:
        description: Build context directory, e.g. docker/ai-code-review.
        type: string
        required: true
      image:
        description: >-
          Full image reference without a tag. Stated explicitly, not derived
          from github.repository, so consumers use the shared image.
        type: string
        required: true
      tag-prefix:
        description: Git tag prefix, e.g. `ai-code-review-`. Used in a regex.
        type: string
        default: ''
      platforms:
        description: Target platforms.
        type: string
        default: linux/amd64
      smoke-test:
        description: Path to an executable inside the image that verifies it. Empty skips it.
        type: string
        default: /smoke-test.sh
      push:
        description: Push after the smoke test passes. Off for pull requests.
        type: boolean
        default: true
    outputs:
      digest:
        description: Digest of the pushed image, for pinning by consumers.
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: Newline-separated list of tags that were pushed.
        value: ${{ jobs.build.outputs.tags }}

# Must be granted by the caller too — a called workflow can only lower it.
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          # type=match, not type=semver: semver refuses a prefixed tag. The regex
          # strips the prefix to give 1.2.0, 1.2 and v1 (the moving tag).
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=match,pattern=${{ inputs.tag-prefix }}v(\d+\.\d+\.\d+),group=1
            type=match,pattern=${{ inputs.tag-prefix }}v(\d+\.\d+),group=1
            type=match,pattern=${{ inputs.tag-prefix }}(v\d+),group=1

      # Loaded, not pushed — candidate:local never leaves the runner.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          load: true
          tags: candidate:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Path passed via env, never interpolated into the script, to avoid injection.
      - name: Smoke test
        if: inputs.smoke-test != ''
        env:
          SMOKE_TEST: ${{ inputs.smoke-test }}
        run: docker run --rm candidate:local "$SMOKE_TEST"

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layers are cached from the build above, so this uploads rather than rebuilds.
      - name: Push
        id: push
        if: inputs.push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Report the digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ inputs.image }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo
            echo "digest: $DIGEST"
            echo '```'
            echo
            echo "To pin it, use:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
